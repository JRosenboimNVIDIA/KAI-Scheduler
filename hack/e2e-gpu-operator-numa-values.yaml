toolkit:
  env:
    # Keep the existing kind containerd configuration in one file.
    - name: RUNTIME_CONFIG_SOURCE
      value: file
node-feature-discovery:
  topologyUpdater:
    enable: true
    createCRDs: true
    kubeletConfigPath: /var/lib/kubelet/config.yaml
    updateInterval: 3s
    nodeSelector:
      mokka.nvidia.com/e2e-gpu: "true"
    annotations:
      nvml-mock.nvidia.com/inject: "false"
    config:
      # This experiment supplies GPU topology. CPU/Memory Managers remain off.
      excludeList:
        '*': [cpu, memory]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
